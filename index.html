<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Dar Sabbah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="lock" class="lock">
  <form id="lockform" class="lockbox" autocomplete="on">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="56" height="56"><path d="M32 60V30M32 40c-8 0-14-5-16-12M32 34c7 0 13-5 15-11M32 30c0-9 4-15 9-19M32 30c0-8-5-14-11-17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="27" r="4" fill="currentColor"/><circle cx="47" cy="22" r="4" fill="currentColor"/><circle cx="41" cy="10" r="4" fill="currentColor"/><circle cx="21" cy="12" r="4" fill="currentColor"/></svg>
    </div>
    <h1><span lang="ar" dir="rtl">دار صبّاح</span><br>Dar Sabbah</h1>
    <p class="muted"><span lang="ar" dir="rtl">موقع خاص بالعائلة</span> · Private family site</p>
    <input type="text" name="username" value="family" autocomplete="username" hidden>
    <label for="pw" class="sr">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password · كلمة السر" required>
    <label class="remember"><input id="remember" type="checkbox" checked> Remember on this device · تذكرني على هذا الجهاز</label>
    <button type="submit">Open · دخول</button>
    <p id="lockerr" class="err" role="alert"></p>
  </form>
</div>
<div id="app" hidden>
  <header class="top">
    <a href="#/" class="brand" id="brand"></a>
    <nav>
      <a href="#/" data-k="home" id="navhome"></a>
      <a href="#/tree" data-k="tree" id="navtree"></a>
    </nav>
    <div class="searchwrap">
      <input id="q" type="search" autocomplete="off">
      <div id="results" class="results" hidden></div>
    </div>
    <button id="lang" class="lang" type="button"></button>
    <button id="logout" class="ghost" type="button"></button>
  </header>
  <main id="main"></main>
  <footer id="foot" class="foot"></footer>
</div>
<script src="data.enc.js"></script>
<script src="app.js"></script>
</body>
</html>
